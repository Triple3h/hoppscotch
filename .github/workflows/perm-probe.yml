name: Perm probe

# 临时诊断 workflow：定位 tag 触发的 run 里 GITHUB_TOKEN 为何 403。用完即删。
on:
  push:
    tags:
      - 'probe-*'
  workflow_dispatch:

# 与 release-desktop.yml 保持完全一致，确保可比
permissions:
  contents: write
  actions: read

jobs:
  probe:
    name: Probe token permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact repro of the real release step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          R="$GITHUB_REPOSITORY"
          APP_TAG="probe-exact-${RANDOM}${RANDOM}"

          echo "--- create the tag first (mimics a tag-push run) ---"
          git tag -a "$APP_TAG" -m "probe exact repro"
          git push origin "$APP_TAG" 2>&1 | tail -2
          echo "TAG_PUSH_EXIT=$?"

          echo "--- step 1: gh release view (silenced in the real script) ---"
          gh release view "$APP_TAG" --repo "$R" >/dev/null 2>&1
          echo "VIEW_EXIT=$?"

          echo "--- step 2: git ls-remote ---"
          git ls-remote --exit-code --tags "$R" "refs/tags/$APP_TAG" >/dev/null 2>&1
          echo "LSREMOTE_EXIT=$?"

          echo "--- step 3: gh release create (exact flags) ---"
          mkdir -p release-assets && echo "x" > release-assets/probe-asset.txt
          gh release create "$APP_TAG" \
            --repo "$R" \
            --title "Hoppscotch Desktop ${APP_TAG}" \
            --notes-file <(echo "probe notes") \
            --prerelease="false" \
            release-assets/*
          echo "CREATE_EXIT=$?"

          echo "--- step 4: the same call via raw REST ---"
          gh api -X POST "repos/$R/releases" \
            -f tag_name="probe-rest-${RANDOM}" -f name="rest probe" -f draft=true 2>&1 | head -5
          echo "REST_EXIT=$?"

          echo "--- cleanup ---"
          gh release delete "$APP_TAG" --repo "$R" --yes --cleanup-tag 2>&1 | head -3
          gh release list --repo "$R" -L 8 2>&1
