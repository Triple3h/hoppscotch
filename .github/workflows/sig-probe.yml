name: Signature probe

# 临时诊断：用 bundler + signer 跑一遍与发布完全相同的最小序列，
# 并上传产物，供本地用 web_update 的验签代码核对「签名是否覆盖清单」。
# 用完即删。
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: Minimal bundler + signer sequence
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - uses: dtolnay/rust-toolchain@stable

      - name: Bundle a small directory, exactly like the release does
        run: |
          cargo build --release --manifest-path packages/hoppscotch-desktop/crates/webapp-bundler/Cargo.toml
          mkdir -p probe-out
          packages/hoppscotch-desktop/crates/webapp-bundler/target/release/webapp-bundler \
            --input packages/hoppscotch-desktop/public \
            --output probe-out/bundle.zip \
            --manifest probe-out/manifest.json \
            --version 1.1.2 \
            --shell-min-version 1.0.0
          echo "== bundle written =="
          ls -l probe-out
          echo "SHA_BEFORE_SIGN=$(sha256sum probe-out/manifest.json | cut -d' ' -f1)"

      - name: Sign it, exactly like the release does
        run: |
          cd packages/hoppscotch-desktop
          if [ -f "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            ARGS=(-f "$TAURI_SIGNING_PRIVATE_KEY")
          else
            ARGS=(-k "$TAURI_SIGNING_PRIVATE_KEY")
          fi
          ARGS+=(-p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD")
          pnpm exec tauri signer sign "${ARGS[@]}" ../../probe-out/manifest.json
          echo "SHA_AFTER_SIGN=$(sha256sum ../../probe-out/manifest.json | cut -d' ' -f1)"
          echo "SIG_SHA=$(sha256sum ../../probe-out/manifest.json.sig | cut -d' ' -f1)"
          ls -l ../../probe-out

      - name: Upload the pair for offline verification
        uses: actions/upload-artifact@v4
        with:
          name: sig-probe-pair
          path: |
            probe-out/manifest.json
            probe-out/manifest.json.sig
          if-no-files-found: error
