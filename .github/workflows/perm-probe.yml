name: Perm probe

# 临时诊断 workflow：定位 tag 触发的 run 里 GITHUB_TOKEN 为何 403。用完即删。
on:
  push:
    tags:
      - 'probe-*'
  workflow_dispatch:

# 与 release-desktop.yml 保持完全一致，确保可比
permissions:
  contents: write
  actions: read

jobs:
  probe:
    name: Probe token permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact real script against v1.1.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          R="$GITHUB_REPOSITORY"
          APP_TAG="v1.1.2"
          mkdir -p release-assets && echo "probe" > release-assets/probe-asset.txt

          echo "=== gh version ==="
          gh --version | head -1
          echo "=== who am I ==="
          gh api user --jq '.login' 2>&1 | head -2

          echo "=== step 1: gh release view (NOT silenced here) ==="
          gh release view "$APP_TAG" --repo "$R"
          echo "STEP1_EXIT=$?"

          echo "=== step 2: git ls-remote (NOT silenced) ==="
          git ls-remote --exit-code --tags "$R" "refs/tags/$APP_TAG"
          echo "STEP2_EXIT=$?"

          echo "=== step 3: exact gh release create ==="
          gh release create "$APP_TAG" \
            --repo "$R" \
            --target "$GITHUB_SHA" \
            --title "Hoppscotch Desktop ${APP_TAG}" \
            --notes-file <(echo "probe") \
            --prerelease="false" \
            release-assets/*
          echo "STEP3_EXIT=$?"

          echo "=== releases ==="
          gh release list --repo "$R" -L 4 2>&1

          echo "=== cleanup (delete the probe release for v1.1.2 if created) ==="
          gh release delete "$APP_TAG" --repo "$R" --yes 2>&1 | head -3
          echo "CLEANUP_EXIT=$?"
