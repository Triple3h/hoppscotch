name: Perm probe

# 临时诊断 workflow：定位 tag 触发的 run 里 GITHUB_TOKEN 为何 403。用完即删。
on:
  push:
    tags:
      - 'probe-*'
  workflow_dispatch:

# 与 release-desktop.yml 保持完全一致，确保可比
permissions:
  contents: write
  actions: read

jobs:
  probe:
    name: Probe token permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Variant bisect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          R="$GITHUB_REPOSITORY"

          echo "===== A: 已存在 tag + 草稿 ====="
          gh release create probe-perms-1 --repo "$R" --title "A" --notes "A" --draft 2>&1 | head -3
          echo "A_EXIT=${PIPESTATUS[0]}"

          echo "===== B: 已存在 tag + 发布态（无资产，无 --prerelease）====="
          gh release create probe-perms-1 --repo "$R" --title "B" --notes "B" 2>&1 | head -3
          echo "B_EXIT=${PIPESTATUS[0]}"

          echo "===== C: 已存在 tag + 发布态 + --prerelease=false + 带资产 ====="
          mkdir -p assets && echo "hello" > assets/probe.txt
          gh release create probe-perms-1 --repo "$R" --title "C" --notes-file <(echo "C") --prerelease=false assets/probe.txt 2>&1 | head -3
          echo "C_EXIT=${PIPESTATUS[0]}"

          echo "===== D: 不存在 tag + 发布态 ====="
          gh release create probe-perms-9$RANDOM --repo "$R" --title "D" --notes "D" 2>&1 | head -3
          echo "D_EXIT=${PIPESTATUS[0]}"

          echo "===== 现有 release 列表 ====="
          gh release list --repo "$R" -L 6 2>&1

          echo "===== 清理 ====="
          for t in probe-perms-1; do gh release delete "$t" --repo "$R" --yes 2>&1 | head -2; done
          gh release list --repo "$R" -L 6 2>&1
