name: Perm probe

# 临时诊断 workflow：定位 tag 触发的 run 里 GITHUB_TOKEN 为何 403。用完即删。
on:
  push:
    tags:
      - 'probe-*'
  workflow_dispatch:

# 与 release-desktop.yml 保持完全一致，确保可比
permissions:
  contents: write
  actions: read

jobs:
  probe:
    name: Probe token permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce with --target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          R="$GITHUB_REPOSITORY"
          mkdir -p release-assets && echo "x" > release-assets/probe-asset.txt

          echo "=== 0. 复刻脚本里的 git ls-remote（看它是否总是失败）==="
          git ls-remote --exit-code --tags "$R" "refs/tags/probe-perms-4" >/dev/null 2>&1
          echo "LSREMOTE_WITH_REPOSLUG_EXIT=$?"
          git ls-remote --exit-code --tags "https://github.com/$R" "refs/tags/probe-perms-4" >/dev/null 2>&1
          echo "LSREMOTE_WITH_URL_EXIT=$?"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "github.ref=$GITHUB_REF"

          echo "=== E. 已存在 tag + --target \$GITHUB_SHA（发布态 + 带资产）==="
          git tag -a probe-e-$RANDOM$RANDOM -m "e" >/dev/null 2>&1
          ET="probe-e-tag"
          git tag -a "$ET" -m "e" 2>/dev/null
          git push origin "$ET" >/dev/null 2>&1
          gh release create "$ET" \
            --repo "$R" \
            --target "$GITHUB_SHA" \
            --title "Hoppscotch Desktop ${ET}" \
            --notes-file <(echo "notes") \
            --prerelease="false" \
            release-assets/*
          echo "E_EXIT=$?"

          echo "=== F. 同样调用，但走 raw REST，打印完整响应 ==="
          gh api -X POST "repos/$R/releases" \
            -f tag_name="probe-f-$RANDOM" -f name="F" -F draft=true \
            -F "target_commitish=$GITHUB_SHA" 2>&1 | head -8
          echo "F_EXIT=$?"

          echo "=== 清理 ==="
          gh release delete "$ET" --repo "$R" --yes --cleanup-tag 2>&1 | head -2
          git push origin ":refs/tags/$ET" 2>&1 | tail -1
          gh release list --repo "$R" -L 8 2>&1
