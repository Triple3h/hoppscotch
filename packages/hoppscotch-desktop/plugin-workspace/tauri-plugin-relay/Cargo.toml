[package]
name = "tauri-plugin-relay"
version = "0.1.0"
authors = [ "CuriousCorrelation" ]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-relay"

[dependencies]
tauri = { version = "2.1.0" }
serde = "1.0"
thiserror = "2"
tracing = "0.1.41"
# Local workspace copy of the relay crate (was pinned to a git rev).
# Kept in-tree so the desktop fork can extend the relay (e.g. SSE
# response streaming) without publishing upstream.
relay = { path = "../relay" }

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
