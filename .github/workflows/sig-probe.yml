name: Signature probe

# 临时诊断（用完即删）：用 CI 的私钥签一个固定的 5 字节内容并上传，
# 本地用 tauri.conf.json 里的公钥验签。
# - 若能验签 => 密钥配对正常，问题在 manifest 的载荷
# - 若不能   => CI 的私钥与配置里的公钥不配对（那 Tauri updater 同样是坏的）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Sign a known payload with the CI key
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Sign a fixed payload
        run: |
          mkdir -p probe-out
          printf 'hello' > probe-out/payload.txt
          echo "PAYLOAD_SHA=$(sha256sum probe-out/payload.txt | cut -d' ' -f1)"
          echo "PAYLOAD_HEX=$(xxd -p probe-out/payload.txt | tr -d '\n')"

          cd packages/hoppscotch-desktop
          if [ -f "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            ARGS=(-f "$TAURI_SIGNING_PRIVATE_KEY")
          else
            ARGS=(-k "$TAURI_SIGNING_PRIVATE_KEY")
          fi
          ARGS+=(-p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD")
          pnpm exec tauri signer sign "${ARGS[@]}" ../../probe-out/payload.txt
          cat ../../probe-out/payload.txt.sig | head -c 120
          echo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sig-probe-payload
          path: |
            probe-out/payload.txt
            probe-out/payload.txt.sig
          if-no-files-found: error
